<!-- A link into the game. With Kadak installed, iOS (universal link) and

<script>

    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var to = ios ? 'https://apps.apple.com/app/id6821840374'
      : /Android/.test(ua) ? 'https://play.google.com/store/apps/details?id=in.tappstudio.kadakchai'
      : '/';
    location.replace(to);
  })();
</script>
