<style>
/* Pital palette, from the Kadak design system (docs/pital-specimen.html in the game repo). */
:root {
  --night-deep: #0B2328; --night: #12343B; --night-raised: #1A4650;
  --teal: #1F6F6B; --tulsi: #8EC3BF; --steam: #CFE3DF;
  --paper: #FFF8EC; --chai: #6E5843; --ink: #231A14;
  --marigold: #F4A300; --pital: #B87400; --haldi: #FFE1AD;
  --f-display: "Baloo 2", "Mukta", system-ui, sans-serif;
  --f-body: "Mukta", system-ui, -apple-system, "Segoe UI", sans-serif;
  --chamfer: 10px;
  --ease-out: cubic-bezier(.22,.61,.36,1); --ease-back: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

#street { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }

.top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 28px) 16px 0; display: grid; justify-items: center; gap: 14px; pointer-events: none; text-align: center; }
.mark { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(52px, 11vw, 88px); line-height: .95; color: var(--marigold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; letter-spacing: -.01em; text-shadow: 0 5px 0 var(--ink); }
.tag { margin: 0; font-weight: 600; font-size: 15px; color: var(--paper); text-shadow: 0 1px 0 var(--ink), 0 0 10px rgba(11,35,40,.55); }
.stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; }
.cta { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; padding: 7px 20px 7px 16px; font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.05; text-align: left; color: var(--ink); text-decoration: none; background: var(--marigold); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink); transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out); }
.cta svg { width: 24px; height: 24px; flex: none; }
.cta small { display: block; font-family: var(--f-body); font-weight: 600; font-size: 11px; letter-spacing: .02em; }
.cta { position: relative; box-shadow: 0 4px 0 var(--ink), 0 0 0 5px rgba(255,225,173,.28), 0 6px 26px rgba(11,35,40,.45); }
.cta::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; box-shadow: 0 0 0 0 rgba(255,225,173,.55); animation: ring 2.6s var(--ease-out) infinite; pointer-events: none; }
.cta + .cta::after { animation-delay: 1.3s; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,225,173,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(255,225,173,0); } }
.cta:hover { background: var(--haldi); }
@media (max-width: 400px) {
  .stores { gap: 8px; }
  .cta { gap: 7px; padding: 6px 13px 6px 11px; font-size: 16px; }
  .cta svg { width: 20px; height: 20px; }
  .cta small { font-size: 10px; }
}
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.floater { position: fixed; left: 0; top: 0; font-family: var(--f-display); font-weight: 800; font-size: 24px; color: var(--marigold); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; pointer-events: none; opacity: 0; white-space: nowrap; }
.floater.go { animation: floatUp 900ms var(--ease-out) forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }

.coin { display: inline-block; width: 1em; height: 1em; vertical-align: -0.12em; margin-right: .08em; }
.bottom { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px); padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.foot { width: max-content; max-width: 100%; padding: 6px 16px 7px; text-align: center; background: rgba(11,35,40,.82); border: 2px solid var(--ink); border-radius: 16px; font-size: 13px; font-weight: 600; }
.foot nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; }
.foot p { margin: 3px 0 0; font-size: 11px; color: var(--steam); }
.foot a { color: var(--paper); text-decoration: none; }
.foot p a { color: inherit; }
.foot a:hover { color: var(--haldi); text-decoration: underline; }
.controls { display: flex; align-items: center; gap: 10px; width: min(100%, 440px); padding: 5px 12px 5px 5px; background: rgba(11,35,40,.82); border: 2px solid var(--ink); border-radius: 999px; }
.icon-btn { flex: none; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; color: var(--ink); background: var(--marigold); border: 2px solid var(--ink); border-radius: 50%; box-shadow: 0 3px 0 var(--ink); cursor: pointer; transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out); }
.icon-btn:hover { background: var(--haldi); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="false"] { background: var(--steam); }
.clock { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.clock output { flex: none; min-width: 62px; font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1; text-align: right; white-space: nowrap; }
.live { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 2px; font: 700 12px/1.2 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--steam); background: none; border: 1.5px solid var(--steam); border-radius: 999px; cursor: pointer; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.live[aria-pressed="true"] { color: var(--ink); background: var(--tulsi); border-color: var(--ink); cursor: default; }
.live[aria-pressed="false"]:hover { color: var(--haldi); border-color: var(--haldi); }
#hour { flex: 1; min-width: 0; height: 22px; margin: 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
#hour::-webkit-slider-runnable-track { height: 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--day); }
#hour::-moz-range-track { height: 6px; border: 2px solid var(--ink); border-radius: 999px; background: var(--day); }
#hour::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border: 2px solid var(--ink); border-radius: 50%; background: var(--marigold); box-shadow: 0 2px 0 var(--ink); }
#hour::-moz-range-thumb { width: 16px; height: 16px; border: 2px solid var(--ink); border-radius: 50%; background: var(--marigold); box-shadow: 0 2px 0 var(--ink); }
@media (max-width: 400px) { .controls { gap: 7px; padding-right: 8px; } .clock { gap: 7px; } .clock output { min-width: 54px; font-size: 13px; } .live { padding: 3px 7px 2px; font-size: 11px; } }
:focus-visible { outline: 3px solid var(--haldi); outline-offset: 3px; }

.tw { animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  .tw { animation: none; }
  .cta::after { animation: none; }
  .floater.go { animation-duration: 600ms; }
}
</style>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const svg = $('#street'), NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The street from the App Store header (Kadak repo, store/creative/src/video/header), in its hero units:
     the tapri spans x 32..430, the kerb is at y 872. Pital palette and the game's live sky keyframes. */
  const C = {
    ink: '#231A14', nightDeep: '#0B2328', nightRaised: '#1A4650', teal: '#1F6F6B', steam: '#CFE3DF', paper: '#FFF8EC',
    jute: '#E9DABD', chaiLight: '#A8916F', chaiDark: '#6E5843', marigold: '#F4A300', marigoldDeep: '#B87400',
    marigoldInk: '#8A5A00', marigoldTint: '#FFE1AD', kulhad: '#B5562F', kulhadTint: '#F5D9C8', kesar: '#E8742A',
    kesarDeep: '#B5521A', kesarLight: '#F59A5C', chilli: '#C8352B', elaichi: '#5E9C3A', tealLight: '#8EC3BF', slate: '#3A3F4F',
  };
  const SKY = [ // hour, top, bottom, ground, buildings, night (0..1)
    [0, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1], [5, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1],
    [7, '#8FB6C8', '#E9E4D6', '#8A8172', '#6E8C96', .15], [10.5, '#5FA9C9', '#CFE7EE', '#A99A80', '#7C97A0', 0],
    [15.5, '#5FA9C9', '#CFE7EE', '#A99A80', '#7C97A0', 0], [18, '#2F4E6E', '#F59A5C', '#6E5843', '#3A3F4F', .55],
    [20, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1], [24, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1],
  ];
  const SUNRISE = 6, SUNSET = 19.3;

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = t => t * t * (3 - 2 * t);
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => '#' + rgb(a).map((v, i) => Math.round(lerp(v, rgb(b)[i], t)).toString(16).padStart(2, '0')).join('');
  function hash(n) { let x = (n * 2654435761) >>> 0; x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; x ^= x >>> 13; return x >>> 0; }
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function skyAt(h) {
    let i = 0; while (i < SKY.length - 2 && h > SKY[i + 1][0]) i++;
    const a = SKY[i], b = SKY[i + 1], k = clamp((h - a[0]) / (b[0] - a[0] || 1));
    const s = { top: mix(a[1], b[1], k), bottom: mix(a[2], b[2], k), ground: mix(a[3], b[3], k), buildings: mix(a[4], b[4], k), night: lerp(a[5], b[5], k) };
    s.far = mix(s.buildings, s.bottom, .45);
    return s;
  }

  /* ---------- Drawing helpers ---------- */
  function el(tag, a, parent = svg) {
    const e = document.createElementNS(NS, tag);
    for (const k in a) e.setAttribute(k, a[k]);
    parent.append(e);
    return e;
  }
  const set = (e, a) => { for (const k in a) e.setAttribute(k, a[k]); };
  const ink = (w = 2) => ({ stroke: C.ink, 'stroke-width': w });
  // Steam: a few soft puffs per source, each rising, widening, swaying and thinning out on a loop.
  const vapours = [];
  function steam(x, y, parent, o = {}) {
    const v = { x, y, n: 7, life: 2600, rise: 46, sway: 5, size: 4, alpha: .5, ...o, phase: Math.random() };
    v.g = el('g', { filter: 'url(#vapour)', fill: C.paper }, parent);
    v.p = Array.from({ length: v.n }, () => el('circle', { r: 0 }, v.g));
    vapours.push(v);
  }
  function stepSteam(now, boost) {
    for (const v of vapours) {
      const b = v.boost ? boost : 0, life = v.life * (1 - b * .35);
      v.p.forEach((c, i) => {
        const a = (now / life + i / v.n + v.phase) % 1, k = i * 1.7 + v.phase * 6;
        const x = v.x + Math.sin(a * 4 + k + now / 1400) * v.sway * a + a * a * v.sway * .8;
        const fade = a < .18 ? a / .18 : (1 - (a - .18) / .82) ** 1.1;
        set(c, { cx: x.toFixed(1), cy: (v.y - a * v.rise * (1 + b * .4)).toFixed(1), r: (v.size * (.5 + a * 1.8) * (1 + b * .3)).toFixed(2), opacity: (fade * v.alpha * (1 + b * 1.2)).toFixed(3) });
      });
    }
  }
  function sparkle(cx, cy, r, parent) {
    const k = r * .28;
    return el('path', { d: `M${cx} ${cy - r}Q${cx + k} ${cy - k} ${cx + r} ${cy}Q${cx + k} ${cy + k} ${cx} ${cy + r}Q${cx - k} ${cy + k} ${cx - r} ${cy}Q${cx - k} ${cy - k} ${cx} ${cy - r}Z`, fill: C.marigoldTint, ...ink(1.5) }, parent);
  }
  function kulhad(x, y, s, parent) {
    const k = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, parent);
    el('path', { d: 'M-11 -26L11 -26L8 0L-8 0Z', fill: C.kulhad, ...ink(2) }, k);
    el('path', { d: 'M-10.2 -18L10.2 -18L9.6 -13L-9.6 -13Z', fill: C.kulhadTint }, k);
    el('ellipse', { cx: 0, cy: -26, rx: 10, ry: 2.6, fill: C.chaiLight, ...ink(1.5) }, k);
  }

  // The world is drawn wide enough for any screen; fit() only moves the viewBox.
  const L = -3000, R = 3400, TOP = -4000, BOTTOM = 3000, KERB = 872, FEET = 860;
  const live = [];                         // [element, attribute, (sky) => value], set when the hour changes

  /* ---------- Sky: stepped bands, stars, sun, moon, birds ---------- */
  live.push([el('rect', { x: L, y: TOP, width: R - L, height: BOTTOM - TOP }), 'fill', s => s.top]);
  [[262, 5], [318, 5], [372, 6], [410, 6], [442, 6], [470, 5]].forEach(([y, amp], i) => {
    let d = `M${L} 960V${y}`;
    for (let x = L; x < R; x += 22) d += `Q${x + 11} ${y + amp} ${x + 22} ${y}`;
    live.push([el('path', { d: d + 'V960Z' }), 'fill', s => mix(s.top, s.bottom, (i + 1) / 6)]);
  });
  const stars = el('g', {});
  live.push([stars, 'opacity', s => clamp((s.night - .5) * 2)]);

  const sun = el('g', {});
  const halo = el('circle', { r: 118, 'fill-opacity': .22 }, sun);
  const disc = el('circle', { r: 78, ...ink(2) }, sun);
  el('path', { d: 'M-52 -20Q-40 -48 -12 -56', fill: 'none', stroke: C.paper, 'stroke-width': 5 }, sun);

  const defs = el('defs', {});
  const blur = el('filter', { id: 'vapour', x: '-100%', y: '-100%', width: '300%', height: '300%' }, defs);
  el('feGaussianBlur', { stdDeviation: 2 }, blur);
  const mask = el('mask', { id: 'crescent', maskContentUnits: 'userSpaceOnUse' }, defs);
  el('circle', { r: 46, fill: '#fff' }, mask);
  el('circle', { cx: 22, cy: -14, r: 40, fill: '#000' }, mask);
  const moon = el('g', {});
  el('circle', { r: 86, fill: C.steam, 'fill-opacity': .08 }, moon);
  el('circle', { r: 46, fill: C.steam, mask: 'url(#crescent)' }, moon);
  el('path', { d: 'M-40 -22A46 46 0 0 0 -8 45', fill: 'none', ...ink(2) }, moon);

  const flock = el('g', { fill: 'none', stroke: C.ink, 'stroke-width': 3 });
  live.push([flock, 'opacity', s => clamp(1 - s.night * 3)]);

  /* ---------- Skyline: a far row in the haze, then the near row with windows, tanks and aerials ---------- */
  for (let i = Math.floor(L / 30); i * 30 < R; i++) {
    const h = hash(i + 3), x = i * 30 + (h % 8), w = 26 - (h % 3) * 4, t = 470 - (h % 5) * 16;
    live.push([el('rect', { x, y: t, width: w, height: 160 }), 'fill', s => s.far]);
    if (h % 4 === 0) live.push([el('rect', { x: x + w / 2 - 1, y: t - 14, width: 2, height: 14 }), 'fill', s => s.far]);
  }
  const near = el('g', {}), roof = el('g', {}), windows = el('g', { fill: C.marigoldTint }), lit = [];
  live.push([near, 'fill', s => s.buildings]);
  live.push([roof, 'fill', s => mix(s.buildings, C.ink, .3)]);

    for (let i = 0; i < n; i++) {
      const u = r(), v = r(), size = .8 + r() * 1.4;
      el('circle', { cx: (vb.x + u * vb.w).toFixed(1), cy: (top + v * (bottom - top)).toFixed(1), r: (size / Math.min(scale, 1)).toFixed(2), fill: C.paper, opacity: (.35 + (1 - v) * .6).toFixed(2), class: i % 5 ? '' : 'tw', style: `animation-delay:${(-r() * 3).toFixed(2)}s` }, stars);
    }
    for (let i = 0; i < 9; i++) sparkle(vb.x + (.05 + r() * .9) * vb.w, top + (.1 + r() * .6) * (bottom - top), (4 + r() * 3) / Math.min(scale, 1), stars);
  }

  /* ---------- The hour: live in India, or wherever the slider puts it ---------- */
  const slider = $('#hour'), out = $('#time'), nowBtn = $('#now');
  const forced = parseFloat(new URLSearchParams(location.search).get('h'));
  let following = !(forced >= 0 && forced < 24), hour = following ? hourNow() : forced, sky = skyAt(hour);
  function hourNow() {
    const ist = new Date(Date.now() + 5.5 * 3600e3);
    return ist.getUTCHours() + ist.getUTCMinutes() / 60;
  }
  function fmt(h) {
    const m = Math.round(h * 60) % 1440, hh = Math.floor(m / 60), mm = m % 60;
    return `${(hh % 12) || 12}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'am' : 'pm'}`;
  }
  slider.style.setProperty('--day', `linear-gradient(90deg, ${Array.from({ length: 25 }, (_, i) => `${skyAt(i).top} ${(i / 24 * 100).toFixed(1)}%`).join(', ')})`);

  function paint() {
    sky = skyAt(hour);
    for (const [e, attr, fn] of live) e.setAttribute(attr, fn(sky));
    document.body.style.background = sky.top;
    document.querySelector('meta[name=theme-color]').setAttribute('content', sky.top);
    // Sun rises on the left of the screen at SUNRISE and sets on the right at SUNSET; the moon takes the night.
    const horizon = 650, peak = vb.y + Math.max(90, headerBottom * .42) / scale, x0 = vb.x + vb.w * .1, x1 = vb.x + vb.w * .9;
    const p = (hour - SUNRISE) / (SUNSET - SUNRISE), up = Math.sin(clamp(p) * Math.PI) ** .7;
    const k = Math.min(1, Math.max(.45, scale)) / scale * .7;   // keep the disc a sensible size on screen
    set(sun, { transform: `translate(${lerp(x0, x1, clamp(p)).toFixed(1)} ${(horizon - up * (horizon - peak)).toFixed(1)}) scale(${k.toFixed(3)})`, display: p > -.03 && p < 1.03 ? 'inline' : 'none' });
    const sunFill = mix(C.kesarLight, C.paper, clamp(up * 1.5));
    set(disc, { fill: sunFill }); set(halo, { fill: sunFill });
    const q = ((hour - SUNSET + 24) % 24) / (24 - (SUNSET - SUNRISE)), mup = Math.sin(clamp(q) * Math.PI) ** .7;
    set(moon, { transform: `translate(${lerp(x0, x1, clamp(q)).toFixed(1)} ${(horizon - mup * (horizon - peak)).toFixed(1)}) scale(${k.toFixed(3)})`, display: q > 0 && q < 1 ? 'inline' : 'none' });
    slider.value = hour; out.textContent = fmt(hour);
    nowBtn.setAttribute('aria-pressed', String(following));
    Sound.night(sky.night);
  }
  slider.addEventListener('input', () => { following = false; hour = parseFloat(slider.value) % 24; paint(); });
  nowBtn.addEventListener('click', () => { following = true; hour = hourNow(); paint(); });
  setInterval(() => { if (following) { hour = hourNow(); paint(); } }, 30e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && following) { hour = hourNow(); paint(); } });

  /* ---------- Sound: the game's street ambience and music, its pour, coin and train horn ---------- */
  const Sound = (() => {
    const FILES = { street: 'street_ambience.mp3', music: 'tab_loop.wav', pour: 'chai_pour.wav', coin: 'coin.wav', clink: 'kulhad_clink.wav', horn: 'train_horn.wav' };
    let ctx, master, street, rail, railPan, bufs = {}, ready = false, nightLevel = 0;
    function loop(buf, gain) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(gain); s.start(); }
    // The train's clickety-clack, made rather than loaded: two pairs of wheel knocks per bar.
    function clackBuffer() {
      const len = Math.round(ctx.sampleRate * .9), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (const at of [0, .11, .45, .56]) {
        const i0 = Math.round(at * ctx.sampleRate);
        for (let i = 0; i < ctx.sampleRate * .08 && i0 + i < len; i++) d[i0 + i] += (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * .012));
      }
      return b;
    }
    async function init() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      street = ctx.createGain(); street.connect(master);
      const music = ctx.createGain(); music.gain.value = .22; music.connect(master);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      rail = ctx.createGain(); rail.gain.value = 0;
      railPan = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
      lp.connect(rail); rail.connect(railPan); railPan.connect(master);
      loop(clackBuffer(), lp);
      night(nightLevel);
      await Promise.all(Object.entries(FILES).map(async ([k, f]) => {
        try { bufs[k] = await ctx.decodeAudioData(await (await fetch('/assets/audio/' + f)).arrayBuffer()); } catch (e) {}
      }));
      if (bufs.street) loop(bufs.street, street);
      if (bufs.music) loop(bufs.music, music);
      ready = true;
    }
    function on() {
      if (!ctx) init(); else ctx.resume();
      if (ctx) master.gain.setTargetAtTime(.9, ctx.currentTime, .2);
    }
    function off() { if (ctx) master.gain.setTargetAtTime(0, ctx.currentTime, .1); }
    function play(name, vol = 1, pan = 0) {
      if (!ready || !enabled || !bufs[name]) return;
      const s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = bufs[name]; g.gain.value = vol;
      if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); s.connect(g); g.connect(p); p.connect(master); }
      else { s.connect(g); g.connect(master); }
      s.start();
    }
    // Quieter streets late at night.
    function night(n) { nightLevel = n; if (street) street.gain.setTargetAtTime(.5 * (1 - n * .55), ctx.currentTime, .5); }
    function train(level, pan) {
      if (!rail) return;
      rail.gain.setTargetAtTime(level * .55, ctx.currentTime, .15);
      if (railPan.pan) railPan.pan.setTargetAtTime(clamp(pan, -1, 1), ctx.currentTime, .15);
    }
    return { on, off, play, night, train };
  })();

  // Sound starts off; a saved "on" waits for the first tap or key, as browsers require.
  const muteBtn = $('#mute');
  let enabled = false;
  function setSound(v, save) {
    enabled = v;
    muteBtn.setAttribute('aria-pressed', String(v));
    muteBtn.setAttribute('aria-label', v ? 'Mute sound' : 'Turn sound on');
    muteBtn.querySelector('.on').style.display = v ? '' : 'none';
    muteBtn.querySelector('.off').style.display = v ? 'none' : '';
    if (save) try { localStorage.setItem('kadak-sound', v ? 'on' : 'off'); } catch (e) {}
    v ? Sound.on() : Sound.off();
  }
  muteBtn.addEventListener('click', () => setSound(!enabled, true));
  setSound(false, false);
  let saved = null; try { saved = localStorage.getItem('kadak-sound'); } catch (e) {}
  if (saved === 'on') {
    muteBtn.setAttribute('aria-pressed', 'true');
    muteBtn.querySelector('.on').style.display = ''; muteBtn.querySelector('.off').style.display = 'none';
    const unlock = e => { removeEventListener('pointerdown', unlock, true); removeEventListener('keydown', unlock, true); if (e.target.closest && e.target.closest('#mute')) return; setSound(true, false); };
    addEventListener('pointerdown', unlock, true); addEventListener('keydown', unlock, true);
  }

  /* ---------- Floating coin numbers, one per sale ---------- */
  const floaters = []; let fi = 0;
  for (let i = 0; i < 12; i++) { const f = document.createElement('span'); f.className = 'floater'; f.setAttribute('aria-hidden', 'true'); document.body.appendChild(f); floaters.push(f); }
  function float(px, py, v) {
    const f = floaters[fi++ % floaters.length];
    f.innerHTML = '+<svg class="coin" aria-hidden="true"><use href="#coin"/></svg>' + v;
    f.style.left = px + 'px'; f.style.top = (py - 20) + 'px';
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  }

  /* ---------- A sale: the kettle pours and puffs, Bablu beams and hops ---------- */
  let lastSale = -1e9;
  function sale(now, x) {
    lastSale = now;
    const pan = (x - (vb.x + vb.w / 2)) / (vb.w / 2) * .6;
    Sound.play('pour', .7, pan * .3);
    setTimeout(() => Sound.play('coin', .45, pan), 260);
    if (Math.random() < .4) setTimeout(() => Sound.play('clink', .5, pan), 520);
  }

  /* ---------- Customers: walk up to a spot by the counter, wait, get their chai, pay, walk off ---------- */
  const K = 3.1, SPOTS = [-45, -140, -235, 455, 530, 715], WAIT = 1600, SERVE = 800, FADE = 240, SPEED = .3;
  const BODIES = [C.chilli, C.elaichi, C.marigold, C.tealLight, C.kesar, C.kulhadTint];
  const HEADS = [C.kulhad, C.marigoldInk, C.chaiDark, C.kesarDeep];
  const PRICES = [10, 10, 12, 15, 15, 20];
  const crowd = [];
  function arrive(now) {
    const free = SPOTS.filter(s => s > vb.x + 10 && s < vb.x + vb.w - 10 && !crowd.some(c => c.spot === s));
    if (!free.length) return;
    const spot = pick(free), bh = 42 * K * (.82 + Math.random() * .36);
    const from = spot < CORE_C ? vb.x - 80 : vb.x + vb.w + 80;
    const walk = reduce ? 0 : Math.abs(spot - from) / SPEED;
    const g = el('g', {}, crowdLayer);
    const shadow = el('ellipse', { rx: 34, ry: 6, cy: FEET + 2, fill: C.ink, 'fill-opacity': .25, stroke: 'none' }, g);
    el('rect', { x: -9 * K, y: FEET - bh, width: 18 * K, height: bh, rx: 9 * K, fill: pick(BODIES) }, g);
    el('circle', { cy: FEET - bh - 8 * K, r: 8 * K, fill: pick(HEADS) }, g);
    crowd.push({ g, shadow, spot, from, walk, bh, born: now, served: false });
  }
  function stepCrowd(now) {
    for (let i = crowd.length - 1; i >= 0; i--) {
      const c = crowd[i], t = now - c.born, arrives = c.walk, leaves = arrives + WAIT, gone = leaves + c.walk;
      let x = c.spot, bob = 0, op = 1;
      if (t < arrives) { x = lerp(c.from, c.spot, t / c.walk); bob = Math.abs(Math.sin(t / 110)) * 2 * K; }
      else if (t > leaves) { x = lerp(c.spot, c.from, (t - leaves) / (c.walk || 1)); bob = Math.abs(Math.sin(t / 110)) * 2 * K; }
      if (reduce) op = Math.min(1, t / FADE, Math.max(0, (leaves + FADE - t) / FADE));
      if (!c.served && t >= arrives + SERVE) {
        c.served = true;
        const [px, py] = toScreen(c.spot, FEET - c.bh - 16 * K - 10);
        float(px, py, pick(PRICES)); sale(now, c.spot);
      }
      if (t >= (reduce ? leaves + FADE : gone)) { c.g.remove(); crowd.splice(i, 1); continue; }
      set(c.g, { transform: `translate(${x.toFixed(1)} ${(-bob).toFixed(1)})`, opacity: op.toFixed(2) });
      c.shadow.setAttribute('cy', FEET + 2 + bob);
    }
  }
  let nextGuest = performance.now() + 1200 + Math.random() * 1300;

  /* ---------- The train: every half a minute or so, left to right, horn as the engine clears the tapri ---------- */
  const TRAIN_SPEED = .22;
  let trainX = null, nextTrain = performance.now() + (reduce ? Infinity : 3000 + Math.random() * 4000), honked = false;
  function stepTrain(now, dt) {
    if (trainX === null) {
      if (now < nextTrain) return;
      trainX = vb.x - TRAIN_LEN - 20; honked = false; tr.setAttribute('display', 'inline');
    }
    trainX += TRAIN_SPEED * dt;
    const front = trainX + TRAIN_LEN, mid = trainX + TRAIN_LEN / 2;
    if (!honked && front > 440) { honked = true; Sound.play('horn', .45, (440 - (vb.x + vb.w / 2)) / vb.w); }
    const onScreen = clamp(Math.min(front - vb.x, vb.x + vb.w - trainX) / 300);
    Sound.train(onScreen, (mid - (vb.x + vb.w / 2)) / (vb.w / 2) * .8);
    if (trainX > vb.x + vb.w + 20) {
      trainX = null; tr.setAttribute('display', 'none'); Sound.train(0, 0);
      nextTrain = now + 22000 + Math.random() * 20000;
      return;
    }
    tr.setAttribute('transform', `translate(${trainX.toFixed(1)} ${VY}) scale(.75)`);
  }

  /* ---------- Birds by day ---------- */
  let birds = null, nextBirds = performance.now() + 6000;
  function stepBirds(now, dt) {
    if (!birds) {
      if (reduce || now < nextBirds || sky.night > .35) return;
      const dir = Math.random() < .5 ? 1 : -1, n = 3 + Math.floor(Math.random() * 4), y = 230 + Math.random() * 120;
      birds = { dir, x: dir > 0 ? vb.x - 80 : vb.x + vb.w + 80, list: Array.from({ length: n }, (_, i) => ({ e: el('path', {}, flock), dx: -dir * (i * 26 + Math.random() * 10), dy: (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 14 + y, ph: Math.random() * 6 })) };
    }
    birds.x += birds.dir * .09 * dt;
    for (const b of birds.list) {
      const x = birds.x + b.dx, y = b.dy + Math.sin(now / 900 + b.ph) * 4, f = Math.sin(now / 120 + b.ph) * 7;
      b.e.setAttribute('d', `M${(x - 11).toFixed(1)} ${(y - f).toFixed(1)}Q${(x - 5).toFixed(1)} ${(y - 6).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}Q${(x + 5).toFixed(1)} ${(y - 6).toFixed(1)} ${(x + 11).toFixed(1)} ${(y - f).toFixed(1)}`);
    }
    if ((birds.dir > 0 && birds.x > vb.x + vb.w + 300) || (birds.dir < 0 && birds.x < vb.x - 300)) {
      flock.textContent = ''; birds = null; nextBirds = now + 15000 + Math.random() * 20000;
    }
  }

  /* ---------- One frame ---------- */
  let last = performance.now(), flicker = 0;
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (now > nextGuest) { if (!document.hidden) arrive(now); nextGuest = now + 2200 + Math.random() * 4300; }
    stepCrowd(now); stepTrain(now, dt); stepBirds(now, dt);

    const s = (now - lastSale) / 1000;
    const tilt = s < .36 ? Math.sin(s / .36 * Math.PI) * 12 : 0;
    kettle.setAttribute('transform', `rotate(${tilt.toFixed(2)} 150 612)`);
    stepSteam(now, s < 2.5 ? Math.exp(-s / .8) : 0);
    const beam = s < 1.1 ? clamp(Math.min(s / .12, (1.1 - s) / .18)) : 0;
    const hop = s < .5 ? Math.sin(s / .5 * Math.PI) * 9 : 0, breath = reduce ? 0 : Math.sin(now / 1000 * Math.PI * 2 / 2.5) * 1.5;
    face.beam.setAttribute('opacity', beam.toFixed(3)); face.warm.setAttribute('opacity', (1 - beam).toFixed(3));
    bablu.setAttribute('transform', `translate(0 ${(-hop + breath).toFixed(2)}) rotate(${(hop * .3).toFixed(2)} 290 650)`);

    // The dog's z drifts up; lit windows come and go at night.
    const zq = (now / 2400) % 1;
    set(zzz, { y: (-30 - zq * 26).toFixed(1), x: (52 + zq * 10).toFixed(1), opacity: (Math.sin(zq * Math.PI)).toFixed(2), 'font-size': (12 + zq * 8).toFixed(1) });
    if (now - flicker > 900 && sky.night > .3) { flicker = now; const w = pick(lit); w.setAttribute('opacity', w.getAttribute('opacity') === '1' ? 0 : 1); }
    requestAnimationFrame(frame);
  }

  /* ---------- Tap to pour ---------- */
  svg.addEventListener('pointerdown', e => { float(e.clientX, e.clientY, 1); sale(performance.now(), vb.x + e.clientX / scale); });

  addEventListener('resize', fit);
  fit();
  document.fonts && document.fonts.ready.then(fit);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
