<style>
/* Pital palette, from the Kadak design system (docs/pital-specimen.html in the game repo). */
:root {
  --night-deep: #0B2328; --night: #12343B; --night-raised: #1A4650;
  --teal: #1F6F6B; --tulsi: #8EC3BF; --steam: #CFE3DF;
  --paper: #FFF8EC; --chai: #6E5843; --ink: #231A14;
  --marigold: #F4A300; --pital: #B87400; --haldi: #FFE1AD;
  --f-display: "Baloo 2", "Mukta", system-ui, sans-serif;
  --f-body: "Mukta", system-ui, -apple-system, "Segoe UI", sans-serif;
  --chamfer: 10px;
  --ease-out: cubic-bezier(.22,.61,.36,1); --ease-back: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

#street { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }

.top { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 28px) 16px 0; display: grid; justify-items: center; gap: 14px; pointer-events: none; text-align: center; }
.mark { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(52px, 11vw, 88px); line-height: .95; color: var(--marigold); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; letter-spacing: -.01em; text-shadow: 0 5px 0 var(--ink); }
.tag { margin: 0; font-weight: 600; font-size: 15px; color: var(--paper); text-shadow: 0 1px 0 var(--ink), 0 0 10px rgba(11,35,40,.55); }
.cta { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; margin-top: 6px; padding: 10px 26px; font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.2; color: var(--ink); text-decoration: none; background: var(--marigold); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink); transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out); }
.cta svg { width: 22px; height: 22px; flex: none; }
.cta:hover { background: var(--haldi); }
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.floater { position: fixed; left: 0; top: 0; font-family: var(--f-display); font-weight: 800; font-size: 24px; color: var(--marigold); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; pointer-events: none; opacity: 0; white-space: nowrap; }
.floater.go { animation: floatUp 900ms var(--ease-out) forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -8px) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }

.coin { display: inline-block; width: 1em; height: 1em; vertical-align: -0.12em; margin-right: .08em; }
.foot { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 18px); display: flex; justify-content: center; pointer-events: none; }
.foot a { pointer-events: auto; font-size: 13px; font-weight: 600; color: var(--paper); text-decoration: none; background: rgba(11,35,40,.78); border: 2px solid var(--ink); padding: 4px 14px; border-radius: 999px; }
.foot a:hover { color: var(--haldi); }
:focus-visible { outline: 3px solid var(--haldi); outline-offset: 3px; }

#steam circle { animation: steam 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
#steam circle:nth-child(2) { animation-delay: .8s; } #steam circle:nth-child(3) { animation-delay: 1.6s; }
@keyframes steam { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 30% { opacity: .7; } 100% { opacity: 0; transform: translate(6px, -34px) scale(1.4); } }
#kettle { transform-box: fill-box; transform-origin: 30% 90%; }
#kettle.tilt { animation: tilt 360ms var(--ease-out); }
@keyframes tilt { 40% { transform: rotate(-14deg); } }

@media (prefers-reduced-motion: reduce) {
  #steam circle { animation: none; opacity: .5; }
  .floater.go { animation-duration: 600ms; }
  #kettle.tilt { animation: none; }
}

    <rect x="10" y="84" width="8" height="10"/><rect x="26" y="104" width="8" height="10"/><rect x="290" y="78" width="8" height="10"/><rect x="306" y="100" width="8" height="10"/><rect x="334" y="104" width="8" height="10"/>
    <rect x="374" y="88" width="8" height="10"/><rect x="420" y="110" width="8" height="10"/><rect x="466" y="78" width="8" height="10"/><rect x="480" y="102" width="8" height="10"/><rect x="512" y="104" width="8" height="10"/><rect x="566" y="84" width="8" height="10"/><rect x="614" y="106" width="8" height="10"/><rect x="664" y="76" width="8" height="10"/><rect x="680" y="100" width="8" height="10"/><rect x="718" y="98" width="8" height="10"/><rect x="772" y="88" width="8" height="10"/><rect x="822" y="110" width="8" height="10"/><rect x="880" y="80" width="8" height="10"/><rect x="934" y="104" width="8" height="10"/><rect x="988" y="84" width="8" height="10"/>

  <!-- tapri -->
  <polygon points="92,58 268,58 280,78 80,78" fill="#1F6F6B" stroke="#231A14" stroke-width="2"/>
  <path d="M80 78 q12 8 25 0 q12 8 25 0 q12 8 25 0 q12 8 25 0 q12 8 25 0 q12 8 25 0 q12 8 25 0 q12 8 25 0" fill="#1F6F6B" stroke="#231A14" stroke-width="2"/>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const svg = $('#street'), NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Fit: keep the tapri, its customers and the board (x 10..392) in view ---------- */
  const CORE_W = 392, CORE_C = 200;
  let vb = { x: 0, y: 0, w: 390, h: 200 }, scale = 1;
  function fit() {
    const W = innerWidth, H = innerHeight;
    // Tall phones get the street higher up, so the sky isn't one big empty band.
    const ground = H * (H > W * 1.3 ? 0.7 : 0.82);
    // As wide as the screen allows, but leave room above the canopy for the header.
    scale = Math.max(0.6, Math.min(W / CORE_W, (ground - 230) / 110, 3));
    vb.w = W / scale; vb.h = H / scale;
    vb.x = CORE_C - vb.w / 2;
    vb.y = 160 - ground / scale;
    svg.setAttribute('viewBox', `${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
    $('#sky-rect').setAttribute('y', vb.y.toFixed(2));
    $('#sky-rect').setAttribute('height', (160 - vb.y).toFixed(2));
    placeStars();
    setSky(hourNow());
  }
  const toScreen = (x, y) => [(x - vb.x) * scale, (y - vb.y) * scale];

  /* ---------- Stars (seeded, so they don't jump on resize) ---------- */
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  const STAR = (() => { const r = rng(7), a = []; for (let i = 0; i < 140; i++) a.push([r(), r(), 0.5 + r() * 0.9]); return a; })();
  function placeStars() {
    const g = $('#stars'); g.textContent = '';
    const top = vb.y, bottom = 62;
    STAR.forEach(([u, v, r]) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (vb.x + u * vb.w).toFixed(1));
      c.setAttribute('cy', (top + v * (bottom - top)).toFixed(1));
      c.setAttribute('r', (r / Math.max(scale, 1) * 1.4).toFixed(2));
      c.setAttribute('opacity', (0.35 + (1 - v) * 0.6).toFixed(2));
      g.appendChild(c);
    });
  }

  /* ---------- Live sky, by the time in India ---------- */
  const KF = [ // hour, skyTop, skyBottom, ground, buildings, night(0..1)
    [0, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1], [5, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1],
    [7, '#8FB6C8', '#E9E4D6', '#8A8172', '#6E8C96', .15], [10.5, '#5FA9C9', '#CFE7EE', '#A99A80', '#7C97A0', 0],
    [15.5, '#5FA9C9', '#CFE7EE', '#A99A80', '#7C97A0', 0], [18, '#2F4E6E', '#F59A5C', '#6E5843', '#3A3F4F', .55],
    [20, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1], [24, '#0B2328', '#1A4650', '#0F2A30', '#163C44', 1],
  ];
  const hex2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => '#' + hex2(a).map((v, i) => Math.round(v + (hex2(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  const forced = parseFloat(new URLSearchParams(location.search).get('h'));
  function hourNow() {
    if (forced >= 0 && forced < 24) return forced;
    const ist = new Date(Date.now() + 5.5 * 3600e3);
    return ist.getUTCHours() + ist.getUTCMinutes() / 60;
  }
  function setSky(h) {
    let i = 0; while (i < KF.length - 2 && h > KF[i + 1][0]) i++;
    const a = KF[i], b = KF[i + 1], t = (h - a[0]) / (b[0] - a[0] || 1);
    const top = mix(a[1], b[1], t);
    $('#sky-top').setAttribute('stop-color', top);
    $('#sky-bot').setAttribute('stop-color', mix(a[2], b[2], t));
    $('#ground').setAttribute('fill', mix(a[3], b[3], t));
    $('#bld').setAttribute('fill', mix(a[4], b[4], t));
    document.querySelector('meta[name=theme-color]').setAttribute('content', top);
    document.body.style.background = top;
    const night = a[5] + (b[5] - a[5]) * t;
    $('#shade').setAttribute('opacity', (night * .28).toFixed(2));
    $('#bulb-glow').setAttribute('opacity', night.toFixed(2));
    $('#bulb').setAttribute('fill', night > .4 ? '#FFE1AD' : '#A8916F');
    $('#windows').setAttribute('opacity', (night * .9).toFixed(2));
    $('#stars').setAttribute('opacity', Math.max(0, (night - .5) * 2).toFixed(2));
    // The sun arcs across what's on screen; at night a small moon sits up and to the right.
    const sunUp = h > 5.5 && h < 19.5, p = (h - 5.5) / 14, sun = $('#sun');
    const left = vb.x + vb.w * .08, span = vb.w * .84, peak = Math.max(vb.y + 40 / scale + 24, -70);
    sun.setAttribute('cx', (sunUp ? left + p * span : vb.x + vb.w * .8).toFixed(0));
    sun.setAttribute('cy', (sunUp ? 150 - Math.sin(p * Math.PI) * (150 - peak) : Math.max(vb.y + 30, 20)).toFixed(0));
    sun.setAttribute('fill', sunUp ? (h > 16 || h < 7.5 ? '#F59A5C' : '#FFF8EC') : '#CFE3DF');
    sun.setAttribute('r', sunUp ? 16 : 10);
  }

  /* ---------- Floating coin numbers, one per pour ---------- */
  const pool = []; let pi = 0;
  for (let i = 0; i < 12; i++) { const f = document.createElement('span'); f.className = 'floater'; f.setAttribute('aria-hidden', 'true'); document.body.appendChild(f); pool.push(f); }
  function float(px, py, v) {
    const f = pool[pi++ % pool.length];
    f.innerHTML = '+<svg class="coin" aria-hidden="true"><use href="#coin"/></svg>' + v;
    f.style.left = px + 'px'; f.style.top = (py - 20) + 'px';
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  }

  /* ---------- Customers: walk up, wait, get their chai, pay, walk off ---------- */
  const SPOTS = [30, 58, 284], WAIT = 1400, SERVE = 800, FADE = 240, SPEED = 70;
  const BODIES = ['#C8352B', '#5E9C3A', '#F4A300', '#8EC3BF', '#E8742A', '#F5D9C8'];
  const HEADS = ['#B5562F', '#8A5A00', '#6E5843', '#B5521A'];
  const PRICES = [10, 10, 12, 15, 15, 20]; // cutting, kadak, masala, elaichi...
  const crowd = [], layer = $('#customers');
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function arrive(now) {
    const free = SPOTS.filter(s => !crowd.some(c => c.spot === s));
    if (!free.length) return;
    const spot = pick(free), h = 0.8 + Math.random() * 0.4;
    const from = spot < CORE_C ? vb.x - 20 : vb.x + vb.w + 20;
    const walk = reduce ? 0 : Math.abs(spot - from) / SPEED * 1000;
    const bh = 42 * h, g = document.createElementNS(NS, 'g');
    g.innerHTML = `<rect x="-9" y="${(166 - bh).toFixed(1)}" width="18" height="${bh.toFixed(1)}" rx="9" fill="${pick(BODIES)}"/><circle cx="0" cy="${(158 - bh).toFixed(1)}" r="8" fill="${pick(HEADS)}"/>`;
    layer.appendChild(g);
    crowd.push({ g, spot, from, walk, bh, born: now, served: false });
    wake();
  }
  function step(now) {
    for (let i = crowd.length - 1; i >= 0; i--) {
      const c = crowd[i], t = now - c.born, arrives = c.walk, leaves = arrives + WAIT, gone = leaves + c.walk;
      let x = c.spot, bob = 0, op = 1;
      if (t < arrives) { const k = t / c.walk; x = c.from + (c.spot - c.from) * k; bob = Math.abs(Math.sin(t / 110)) * 2; }
      else if (t > leaves) { const k = (t - leaves) / (c.walk || 1); x = c.spot + (c.from - c.spot) * k; bob = Math.abs(Math.sin(t / 110)) * 2; }
      if (reduce) op = Math.min(1, t / FADE, Math.max(0, (leaves + FADE - t) / FADE));
      if (!c.served && t >= arrives + SERVE) {
        c.served = true;
        const v = pick(PRICES), [px, py] = toScreen(c.spot, 158 - c.bh - 10);
        float(px, py, v); steam();
      }
      if (t >= (reduce ? leaves + FADE : gone)) { c.g.remove(); crowd.splice(i, 1); continue; }
      c.g.setAttribute('transform', `translate(${x.toFixed(1)} ${(-bob).toFixed(1)})`);
      c.g.setAttribute('opacity', op.toFixed(2));
    }
  }
  let raf = 0;
  function loop(now) { step(now); raf = crowd.length ? requestAnimationFrame(loop) : 0; }
  function wake() { if (!raf) raf = requestAnimationFrame(loop); }

  let timer;
  function schedule(first) {
    const wait = first ? 1200 + Math.random() * 1300 : 2200 + Math.random() * 4300;
    timer = setTimeout(() => { if (!document.hidden) arrive(performance.now()); schedule(false); }, wait);
  }
  schedule(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setSky(hourNow()); });

  /* ---------- Tap to pour ---------- */
  const kettle = $('#kettle');
  function steam() { kettle.classList.remove('tilt'); void kettle.getBBox(); kettle.classList.add('tilt'); }
  svg.addEventListener('pointerdown', e => { float(e.clientX, e.clientY, 1); steam(); });

  addEventListener('resize', fit);
  fit();
  setInterval(() => setSky(hourNow()), 60e3);
})();
</script>
</body>
